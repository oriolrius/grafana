# Configuration for Docker executor with host Docker socket mount
# The runner should be configured with:
# volumes = ["/var/run/docker.sock:/var/run/docker.sock", "/cache"]
# privileged = true

image: docker:27-dind

variables:
  # Try without explicit DOCKER_HOST to let Docker find it
  GRAFANA_IMAGE: grafana/grafana-oss:dev
  DOCKER_DRIVER: overlay2

stages:
  - build
  - push

build-grafana:
  stage: build
  tags: [wsl2]
  rules:
    - if: $CI_PIPELINE_SOURCE == 'web'
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == 'push'
  before_script:
    # Debug Docker socket
    - ls -la /var/run/ || true
    - ls -la /var/run/docker.sock || true
    # Try to connect to Docker
    - docker version || echo "Docker client works but daemon connection failed"
    # Check if socket is mounted
    - test -S /var/run/docker.sock && echo "Socket exists" || echo "Socket not found"
    # Try with explicit socket path
    - DOCKER_HOST=unix:///var/run/docker.sock docker info || echo "Direct socket connection failed"
    # Install build dependencies
    - apk add --no-cache make git bash gcc g++ musl-dev nodejs npm go yarn
    # Setup buildx if available
    - docker buildx version 2>/dev/null || docker buildx create --use 2>/dev/null || true
  script:
    - echo "Starting Grafana Docker build process..."
    - echo "Building Grafana Docker image with make build-docker-full"
    - make build-docker-full
    - echo "Build completed successfully"
    - echo "Verifying image was created"
    - docker images | grep grafana
  artifacts:
    reports:
      dotenv: build.env
    expire_in: 1 hour

push-to-registry:
  stage: push
  tags: [wsl2]
  needs: ["build-grafana"]
  rules:
    - if: $CI_PIPELINE_SOURCE == 'web'
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == 'push'
  before_script:
    - echo "$QA_REGISTRY_PASSWORD" | docker login -u "$QA_REGISTRY_USER" --password-stdin "$QA_REGISTRY"
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        export CI_TAG="$CI_COMMIT_TAG"
      else
        export CI_TAG="$CI_COMMIT_REF_SLUG"
      fi
    - echo "Using image tag $CI_TAG"
  script:
    - echo "Tagging Docker image for Nexiona registry"
    - docker tag ${GRAFANA_IMAGE} "$QA_REGISTRY/$CUSTOMER/$SERVICE:$CI_TAG"
    - docker tag ${GRAFANA_IMAGE} "$QA_REGISTRY/$CUSTOMER/$SERVICE:latest"

    - echo "Pushing to Nexiona registry"
    - docker push "$QA_REGISTRY/$CUSTOMER/$SERVICE:$CI_TAG"
    - docker push "$QA_REGISTRY/$CUSTOMER/$SERVICE:latest"

    - echo "Images pushed successfully:"
    - echo "  - $QA_REGISTRY/$CUSTOMER/$SERVICE:$CI_TAG"
    - echo "  - $QA_REGISTRY/$CUSTOMER/$SERVICE:latest"
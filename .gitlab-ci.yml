# Using Docker-in-Docker service since socket mount is not working

image: docker:27

services:
  - name: docker:27-dind
    alias: docker
    command: ["--tls=false"]

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2
  GRAFANA_IMAGE: grafana/grafana-oss:dev
  # Go proxy settings to improve module download reliability
  GOPROXY: "https://proxy.golang.org,direct"
  GOSUMDB: "sum.golang.org"
  GO111MODULE: "on"

stages:
  - debug
  - build
  - push

debug-variables:
  stage: debug
  image: alpine:latest
  tags: [wsl2]
  rules:
    - when: always
  script:
    - echo "=== CI Variables Debug ==="
    - echo "CUSTOMER=${CUSTOMER}"
    - echo "SERVICE=${SERVICE}"
    - echo "QA_REGISTRY=${QA_REGISTRY}"
    - echo "QA_REGISTRY_USER=${QA_REGISTRY_USER}"
    - if [ -n "${QA_REGISTRY_PASSWORD}" ]; then echo "QA_REGISTRY_PASSWORD exists"; else echo "QA_REGISTRY_PASSWORD not set"; fi
    - echo "=========================="

build-grafana:
  stage: build
  tags: [wsl2]
  rules:
    - if: $CI_PIPELINE_SOURCE == 'web'
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == 'push'
    - when: manual  # Allow manual trigger for debugging
  before_script:
    # Wait for Docker service to be ready
    - until docker info; do echo "Waiting for Docker..."; sleep 2; done
    - echo "Docker is ready!"
    - docker version
    # Install build dependencies
    - apk add --no-cache make git bash gcc g++ musl-dev nodejs npm go yarn
    # Setup buildx
    - docker buildx create --driver docker-container --use || true
  script:
    - echo "Starting Grafana Docker build process..."
    - echo "Building Grafana Docker image with make build-docker-full"
    # Add build args including network retry and Go proxy settings
    - |
      DOCKER_BUILD_ARGS="--load --build-arg GOPROXY=$GOPROXY --build-arg GOSUMDB=$GOSUMDB --network=host" \
      make build-docker-full || \
      (echo "Build failed, retrying..." && sleep 10 && \
       DOCKER_BUILD_ARGS="--load --build-arg GOPROXY=$GOPROXY --build-arg GOSUMDB=$GOSUMDB --network=host" \
       make build-docker-full)
    - echo "Build completed successfully"
    - echo "Verifying image was created"
    - docker images | grep grafana
  artifacts:
    reports:
      dotenv: build.env
    expire_in: 1 hour

push-to-registry:
  stage: push
  tags: [wsl2]
  needs: ["build-grafana"]
  rules:
    - if: $CI_PIPELINE_SOURCE == 'web'
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == 'push'
    - if: $CI_PIPELINE_SOURCE == 'api'  # For glab ci run
  before_script:
    # Debug: Check available variables
    - echo "=== Debugging CI Variables ==="
    - echo "CUSTOMER=${CUSTOMER}"
    - echo "SERVICE=${SERVICE}"
    - echo "QA_REGISTRY=${QA_REGISTRY}"
    - echo "QA_REGISTRY_USER=${QA_REGISTRY_USER}"
    - if [ -n "${QA_REGISTRY_PASSWORD}" ]; then echo "QA_REGISTRY_PASSWORD is set = yes"; else echo "QA_REGISTRY_PASSWORD is set = no"; fi
    - echo "CI_COMMIT_TAG=${CI_COMMIT_TAG}"
    - echo "CI_COMMIT_REF_SLUG=${CI_COMMIT_REF_SLUG}"
    - echo "GRAFANA_IMAGE=${GRAFANA_IMAGE}"
    - echo "==========================="

    # Login to registry
    - echo "$QA_REGISTRY_PASSWORD" | docker login -u "$QA_REGISTRY_USER" --password-stdin "$QA_REGISTRY"
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        export CI_TAG="$CI_COMMIT_TAG"
      else
        export CI_TAG="$CI_COMMIT_REF_SLUG"
      fi
    - echo "Using image tag $CI_TAG"
  script:
    - echo "Tagging Docker image for Nexiona registry"
    - docker tag ${GRAFANA_IMAGE} "$QA_REGISTRY/$CUSTOMER/$SERVICE:$CI_TAG"
    - docker tag ${GRAFANA_IMAGE} "$QA_REGISTRY/$CUSTOMER/$SERVICE:latest"

    - echo "Pushing to Nexiona registry"
    - docker push "$QA_REGISTRY/$CUSTOMER/$SERVICE:$CI_TAG"
    - docker push "$QA_REGISTRY/$CUSTOMER/$SERVICE:latest"

    - echo "Images pushed successfully:"
    - echo "  - $QA_REGISTRY/$CUSTOMER/$SERVICE:$CI_TAG"
    - echo "  - $QA_REGISTRY/$CUSTOMER/$SERVICE:latest"
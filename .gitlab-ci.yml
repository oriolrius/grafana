# Simplified GitLab CI/CD for Grafana build and push
# Single job approach to avoid Docker image isolation issues

image: docker:27

services:
  - name: docker:27-dind
    alias: docker
    command: ["--tls=false"]

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2
  GRAFANA_IMAGE: grafana/grafana-oss:dev
  # Go proxy settings for reliable module downloads
  GOPROXY: "https://proxy.golang.org,direct"
  GOSUMDB: "sum.golang.org"
  GO111MODULE: "on"

stages:
  - deploy

build-and-push:
  stage: deploy
  tags: [wsl2]
  artifacts: {}  # Explicitly disable artifacts to avoid warnings
  rules:
    - if: $CI_PIPELINE_SOURCE == 'web'
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == 'push'
    - if: $CI_PIPELINE_SOURCE == 'api'  # For glab ci run
  before_script:
    - until docker info; do echo "Waiting for Docker..."; sleep 2; done
    - echo "Docker is ready!"
    - docker version
    - apk add --no-cache make git bash gcc g++ musl-dev nodejs npm go yarn jq
    - docker buildx create --driver docker-container --use || true
    - echo "$QA_REGISTRY_PASSWORD" | docker login -u "$QA_REGISTRY_USER" --password-stdin "$QA_REGISTRY"
    - 'if [ -n "$CI_COMMIT_TAG" ]; then export CI_TAG="$CI_COMMIT_TAG"; else export CI_TAG="$CI_COMMIT_REF_SLUG"; fi'
    - 'echo "Using image tag: $CI_TAG"'
    - 'export PACKAGE_VERSION=$(cat package.json | jq -r .version)'
    - 'echo "Package version: $PACKAGE_VERSION"'
    - 'export SERVICE="$SERVICE-$PACKAGE_VERSION"'
    - 'echo "Service name with version: $SERVICE"'
  script:
    - |
      if docker images | grep -q "grafana/grafana-oss.*dev"; then
        echo "✅ Found existing image, skipping build"
        docker images | grep grafana
      else
        echo "📦 Building Grafana Docker image..."
        DOCKER_BUILD_ARGS="--load --build-arg GOPROXY=$GOPROXY --build-arg GOSUMDB=$GOSUMDB --network=host" \
        make build-docker-full || \
        (echo "Build failed, retrying..." && sleep 10 && \
         DOCKER_BUILD_ARGS="--load --build-arg GOPROXY=$GOPROXY --build-arg GOSUMDB=$GOSUMDB --network=host" \
         make build-docker-full)
        echo "✅ Build completed successfully"
        docker images | grep grafana
      fi
    - echo "🏷️  Tagging Docker images for Nexiona registry..."
    - docker tag ${GRAFANA_IMAGE} "$QA_REGISTRY/$CUSTOMER/$SERVICE:$CI_TAG"
    - docker tag ${GRAFANA_IMAGE} "$QA_REGISTRY/$CUSTOMER/$SERVICE:latest"
    - echo "📤 Pushing to Nexiona registry..."
    - docker push "$QA_REGISTRY/$CUSTOMER/$SERVICE:$CI_TAG"
    - docker push "$QA_REGISTRY/$CUSTOMER/$SERVICE:latest"
    - echo "✅ Images pushed successfully:"
    - echo "  - $QA_REGISTRY/$CUSTOMER/$SERVICE:$CI_TAG"
    - echo "  - $QA_REGISTRY/$CUSTOMER/$SERVICE:latest"
    - echo "🧹 Cleaning up local Docker images..."
    - docker rmi ${GRAFANA_IMAGE} || true
    - docker rmi "$QA_REGISTRY/$CUSTOMER/$SERVICE:$CI_TAG" || true
    - docker rmi "$QA_REGISTRY/$CUSTOMER/$SERVICE:latest" || true
    - echo "✅ Cleanup complete - next pipeline will build from scratch"
  after_script:
    - docker logout $QA_REGISTRY || true